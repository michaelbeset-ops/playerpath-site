name: Site bouwen en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechten die GitHub Pages nodig heeft om te mogen publiceren.
permissions:
  contents: read
  pages: write
  id-token: write

# Bij snel achter elkaar pushen: laat de laatste winnen, maar breek
# een lopende publicatie niet af.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro 7 eist Node 22.12 of hoger; de actie pakt anders Node 20.
          node-version: 22

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - id: publicatie
        uses: actions/deploy-pages@v4
